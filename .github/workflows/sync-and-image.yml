name: Sync upstream and publish dark-mode image

# Keeps this fork's litellm_internal_staging in sync with
# BerriAI/litellm:litellm_internal_staging and publishes the themed proxy
# image to the owner's Gitea registry on every run. Fails email
# eternity336@gmail.com when any part of the run goes wrong.

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check required secrets
        env:
          GITEA_REGISTRY: ${{ secrets.GITEA_REGISTRY }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -uo pipefail
          for name in GITEA_REGISTRY GITEA_TOKEN GMAIL_USER GMAIL_APP_PASSWORD; do
            value="${!name:-}"
            if [ -z "${value}" ]; then
              echo "::error::Secret ${name} is not set (or empty) on the fork."
            else
              echo "Secret ${name}: present (${#value} chars)"
            fi
          done
          if [ -z "${GITEA_REGISTRY:-}" ] || [ -z "${GITEA_TOKEN:-}" ] \
            || [ -z "${GMAIL_USER:-}" ] || [ -z "${GMAIL_APP_PASSWORD:-}" ]; then
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/BerriAI/litellm.git
          git fetch --no-tags upstream litellm_internal_staging
          base=$(git rev-parse upstream/litellm_internal_staging)
          if [ "$(git merge-base HEAD "$base")" = "$base" ]; then
            echo "Upstream has not advanced; nothing to sync."
          else
            git merge --no-edit "$base"
            if ! git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "::error::Pushing the merged base failed. A real merge conflict needs manual resolution; the next scheduled run retries."
              exit 1
            fi
            echo "Synced fork with upstream base."
          fi

      - name: Check Gitea image repository
        env:
          GITEA_REGISTRY: ${{ secrets.GITEA_REGISTRY }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/gitea.json -w '%{http_code}' \
            -H "Authorization: token $GITEA_TOKEN" \
            "https://${GITEA_REGISTRY}/api/v1/repos/jochsankehl/litellm")
          if [ "${code}" = "200" ]; then
            echo "Image repository jochsankehl/litellm is present."
          else
            echo "::error::Gitea returned ${code} for jochsankehl/litellm: $(cat /tmp/gitea.json)"
            echo "::error::Create the repository in the Gitea UI (name: litellm) and enable it under Settings, Features, Container Image. The API cannot create or enable container image repositories."
            exit 1
          fi

      - name: Build and push image
        env:
          GITEA_REGISTRY: ${{ secrets.GITEA_REGISTRY }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          echo "Building ${GITEA_REGISTRY}/jochsankehl/litellm:latest-darkmode from commit ${sha}..."
          docker build --platform linux/amd64 \
            -t "${GITEA_REGISTRY}/jochsankehl/litellm:latest-darkmode" \
            -t "${GITEA_REGISTRY}/jochsankehl/litellm:${sha}" .
          echo "${GITEA_TOKEN}" | docker login "${GITEA_REGISTRY}" --username jochsankehl --password-stdin
          docker push "${GITEA_REGISTRY}/jochsankehl/litellm:latest-darkmode"
          docker push "${GITEA_REGISTRY}/jochsankehl/litellm:${sha}"
          echo "Pushed ${GITEA_REGISTRY}/jochsankehl/litellm:latest-darkmode and :${sha}."

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "LiteLLM dark-mode pipeline failed (run ${{ github.run_id }})"
          to: eternity336@gmail.com
          from: ${{ secrets.GMAIL_USER }}
          body: |
            The sync-and-image workflow failed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
