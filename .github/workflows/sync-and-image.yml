name: Sync upstream and publish dark-mode image

# Keeps this fork's litellm_internal_staging in sync with
# BerriAI/litellm:litellm_internal_staging and publishes the themed proxy
# image to ghcr.io/eternity336/litellm on every run. Fails email
# eternity336@gmail.com when any part of the run goes wrong.

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check required secrets
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -uo pipefail
          for name in GHCR_TOKEN GMAIL_USER GMAIL_APP_PASSWORD; do
            value="${!name:-}"
            if [ -z "${value}" ]; then
              echo "::error::Secret ${name} is not set (or empty) on the fork."
            else
              echo "Secret ${name}: present (${#value} chars)"
            fi
          done
          if [ -z "${GHCR_TOKEN:-}" ] || [ -z "${GMAIL_USER:-}" ] \
            || [ -z "${GMAIL_APP_PASSWORD:-}" ]; then
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "eternity336"
          git config user.email "eternity336@users.noreply.github.com"
          git remote add upstream https://github.com/BerriAI/litellm.git
          git fetch --no-tags upstream litellm_internal_staging
          base=$(git rev-parse upstream/litellm_internal_staging)
          if [ "$(git merge-base HEAD "$base")" = "$base" ]; then
            echo "Upstream has not advanced; nothing to sync."
            exit 0
          fi
          # Merge without committing so the inherited workflows upstream
          # re-added can be stripped before the merge commit is created.
          git merge --no-edit --no-commit --no-ff "$base" || true
          # This fork ships a themed image; it is not a development repo. The
          # only workflow allowed to run here is sync-and-image.yml. Keep our
          # deletions when upstream modified a file we removed.
          while IFS= read -r line; do
            case "${line:0:2}" in
              DU | DD) git rm -f -q -- "${line:3}" ;;
            esac
          done < <(git status --porcelain)
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name 'sync-and-image.yml' -delete
          git add -A -- .github/workflows
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Upstream changed the same lines the fork changed. Resolve the merge manually; the next scheduled run retries."
            git merge --abort
            exit 1
          fi
          git commit --no-edit
          if ! git push origin HEAD:"${GITHUB_REF_NAME}"; then
            echo "::error::Pushing the merged base failed. The next scheduled run retries."
            exit 1
          fi
          echo "Synced fork with upstream base."

      - name: Build and push image
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          image="ghcr.io/eternity336/litellm"
          echo "Building ${image}:latest-darkmode from commit ${sha}..."
          docker build --platform linux/amd64 \
            -t "${image}:latest-darkmode" \
            -t "${image}:${sha}" . 2>&1 | tee /tmp/build.log
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username eternity336 --password-stdin
          docker push "${image}:latest-darkmode"
          docker push "${image}:${sha}"
          echo "Pushed ${image}:latest-darkmode and ${image}:${sha}."

      - name: Keep build log tail for the failure email
        if: failure()
        id: buildtail
        run: |
          {
            echo "buildlogtail<<GITHUB_EOF"
            tail -n 60 /tmp/build.log 2>/dev/null || echo "no build log was captured (failure happened before docker build)"
            echo "GITHUB_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "LiteLLM dark-mode pipeline failed (run ${{ github.run_id }})"
          to: eternity336@gmail.com
          from: ${{ secrets.GMAIL_USER }}
          body: |
            The sync-and-image workflow failed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}

            Build log tail:
            ${{ steps.buildtail.outputs.buildlogtail }}
